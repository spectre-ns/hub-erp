services:
  hub:
    build: .
    image: hub-erp-proto:local
    container_name: hub-erp
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - hub-state:/hub/state
      # The hub's Frames: its own volume, filled on the first start with the Frames the image ships; every release
      # writes the released texts into it, never into this checkout. The profiles and config come from the image.
      # To work on Frames and profiles in this checkout's folders instead: docker-compose.frames-dir.yml, a separate
      # development hub (its own project, hub-dev, with its own containers, image tag and ports; see its header).
      # It never replaces this volume for the live hub.
      - hub-frames:/hub/frames
      # The script worker's socket, read-only here: the hub connects to it and can put nothing beside it.
      - script-worker-socket:/run/script-worker:ro
    environment:
      HUBPROTO_ROOT: /hub
      HUBPROTO_CAD_WORKER_URL: http://cad-worker:9000
      # Configuration scripts (issue #34) run only in the script-worker service below, reached over its Unix socket. The
      # image sets HUBPROTO_DEPLOYED=1, so without this the hub refuses to run a script rather than run one beside itself.
      HUBPROTO_SCRIPT_WORKER_URL: unix:///run/script-worker/worker.sock
      # Largest request body the shell accepts (bytes); larger uploads get 413.
      HUBPROTO_MAX_UPLOAD: "26214400"
      # The integrated editor (Collabora Online, WOPI): where the browser reaches the editor, where the editor
      # reaches this hub, where this hub reads the editor's discovery document, and this hub's public origin.
      HUBPROTO_COLLABORA_URL: ${HUBPROTO_COLLABORA_URL:-http://localhost:9980}
      HUBPROTO_WOPI_BASE: http://hub:8080
      HUBPROTO_COLLABORA_DISCOVERY: http://collabora:9980
      HUBPROTO_PUBLIC_URL: ${HUBPROTO_PUBLIC_URL:-http://localhost:8080}
      # Local models for the cogs: Ollama on the host, reached through the ollama-relay service. A cog is bundled
      # with the model its profile names (ollama/<name> or claude-*); if that model cannot be reached the cog is unavailable.
      HUBPROTO_OLLAMA_URL: ${HUBPROTO_OLLAMA_URL:-http://host.docker.internal:11434}
      # Cogs work from queues: asking one returns at once and its answer lands where it was asked. "worker" works the
      # queues on a thread in this process; "service" leaves them to the cog-users service below.
      HUBPROTO_COG_QUEUE: ${HUBPROTO_COG_QUEUE:-worker}
      # Hosted models (Claude) are switched on for the senior cogs, which compile SOP changes (the compile-frame
      # committee); every other cog stays on its local model. Switched on 2026-11-09 by the system administrator
      # (bob) as an installation change under the IT SOP, at the product owner's instruction, with the
      # change-control v2 rollout. ANTHROPIC_API_KEY comes from .env (never committed).
      HUBPROTO_HOSTED_MODELS: "on"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - cad-worker
      - collabora
      - script-worker
    restart: unless-stopped

  # Ollama on this machine listens on 127.0.0.1 only; this relay listens on the Docker bridge address (what
  # host.docker.internal resolves to inside the containers) and forwards to it, so the hub can use the local model
  # without changing Ollama's own configuration. Remove it if Ollama is set to listen on all interfaces.
  ollama-relay:
    image: alpine/socat:latest
    container_name: hub-erp-ollama-relay
    network_mode: host
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        IP=$$(ip -4 -o addr show docker0 | awk '{print $$4}' | cut -d/ -f1);
        echo "relaying $$IP:11434 to 127.0.0.1:11434";
        exec socat TCP-LISTEN:11434,bind=$$IP,fork,reuseaddr TCP:127.0.0.1:11434
    restart: unless-stopped

  # The cogs' queues worked in a process of their own (instead of the hub's worker thread): set
  # HUBPROTO_COG_QUEUE=service for the hub and run: docker compose --profile cog-users up -d
  cog-users:
    image: hub-erp-proto:local
    container_name: hub-erp-cog-users
    command: ["hubproto", "cog-users", "--loop", "3"]
    volumes:
      - hub-state:/hub/state
      - hub-frames:/hub/frames
    environment:
      HUBPROTO_ROOT: /hub
      HUBPROTO_CAD_WORKER_URL: http://cad-worker:9000
      HUBPROTO_OLLAMA_URL: ${HUBPROTO_OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["cog-users"]
    depends_on:
      - hub
    restart: unless-stopped

  # The cogs' standing duties (Duty: lines in their profiles), taken up once a day each:
  #   docker compose --profile agents up -d
  agents:
    image: hub-erp-proto:local
    container_name: hub-erp-agents
    command: ["hubproto", "agent-duties", "--loop", "900"]
    volumes:
      - hub-state:/hub/state
      - hub-frames:/hub/frames
    environment:
      HUBPROTO_ROOT: /hub
      HUBPROTO_OLLAMA_URL: ${HUBPROTO_OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["agents"]
    depends_on:
      - hub
    restart: unless-stopped

  # Collabora Online: the office editor documents open in. It fetches files from the hub over WOPI
  # (http://hub:8080/wopi/...) and the browser loads its pages from localhost:9980.
  collabora:
    image: collabora/code:latest
    container_name: hub-erp-collabora
    ports:
      - "127.0.0.1:9980:9980"
    environment:
      aliasgroup1: http://hub:8080
      server_name: ${HUBPROTO_COLLABORA_HOST:-localhost:9980}
      extra_params: --o:ssl.enable=false --o:ssl.termination=false --o:net.content_security_policy=frame-ancestors ${HUBPROTO_PUBLIC_URL:-http://localhost:8080};
      dictionaries: en_US
    cap_add:
      - MKNOD
    restart: unless-stopped

  # FreeCAD and KiCad behind the /invoke seam. Large image; build with:
  #   docker compose build cad-worker
  # Without the tools installed (CAD_TOOLS=none) it answers with synthetic exports.
  cad-worker:
    build:
      context: .
      dockerfile: docker/cad-worker/Dockerfile
      args:
        CAD_TOOLS: ${CAD_TOOLS:-full}
    image: hub-erp-cad-worker:local
    container_name: hub-erp-cad-worker
    environment:
      HUBPROTO_CAD_FAKE: ${HUBPROTO_CAD_FAKE:-0}
    expose:
      - "9000"
    restart: unless-stopped

  # Configuration scripts (issue #34): a person's script runs here, once, and its output goes on a change order.
  # The operating system is the boundary:
  #   - network_mode none: no interface but loopback, so it reaches nothing, the hub included (on a shared network it
  #     could reach the hub's port 8080). The hub reaches it over a Unix socket on the script-worker-socket volume
  #     (a 1 MB tmpfs owned by the worker's user), mounted read-only in the hub;
  #   - a read-only root with a small noexec tmpfs for the runs' temporary folders; no hub state, no secrets, no
  #     Docker socket, no other volume;
  #   - every capability dropped, no-new-privileges, an unprivileged user (10001);
  #   - a seccomp allow-list (docker/script-worker/seccomp.json: socket only for AF_UNIX; no connect, ptrace, mount,
  #     unshare, setns or bpf), and inside each run a stricter filter of its own (no execve, fork or socket at all);
  #   - pids, memory and CPU limits for the container, and per run hard rlimits, a timeout and an output cap.
  # It is long-running, with a fresh subprocess and temporary folder per run: a fresh container per run would need a
  # launcher holding the Docker socket (issue #35, decision 1), and the hub must never hold it.
  script-worker:
    build:
      context: .
      dockerfile: docker/script-worker/Dockerfile
    image: hub-erp-script-worker:local
    container_name: hub-erp-script-worker
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    volumes:
      - script-worker-socket:/run/script-worker
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/script-worker/seccomp.json
    user: "10001:10001"
    ipc: none
    pids_limit: 16
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    ulimits:
      nofile: 256
      core: 0
    environment:
      HUBPROTO_SCRIPT_SOCKET: /run/script-worker/worker.sock
    restart: unless-stopped

  # One-off escalation tick for SLAs; run with: docker compose run --rm tick
  tick:
    image: hub-erp-proto:local
    profiles: ["tools"]
    volumes:
      - hub-state:/hub/state
      - hub-frames:/hub/frames
    entrypoint: ["hubproto", "tick"]

volumes:
  hub-state:
  hub-frames:
  # Holds only the script worker's Unix socket: a small tmpfs, owned by the worker's user, gone when stopped.
  script-worker-socket:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,uid=10001,gid=10001,mode=0755"
