services:
  hub:
    build: .
    image: hub-erp-proto:local
    container_name: hub-erp
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - hub-state:/hub/state
      # Edit Frames on the host and recompile from inside the container:
      #   docker compose exec hub hubproto compile
      - ./frames:/hub/frames
      - ./profiles:/hub/profiles
    environment:
      HUBPROTO_ROOT: /hub
      HUBPROTO_CAD_WORKER_URL: http://cad-worker:9000
      # Largest request body the shell accepts (bytes); larger uploads get 413.
      HUBPROTO_MAX_UPLOAD: "26214400"
      # The integrated editor (Collabora Online, WOPI): where the browser reaches the editor, where the editor
      # reaches this hub, where this hub reads the editor's discovery document, and this hub's public origin.
      HUBPROTO_COLLABORA_URL: ${HUBPROTO_COLLABORA_URL:-http://localhost:9980}
      HUBPROTO_WOPI_BASE: http://hub:8080
      HUBPROTO_COLLABORA_DISCOVERY: http://collabora:9980
      HUBPROTO_PUBLIC_URL: ${HUBPROTO_PUBLIC_URL:-http://localhost:8080}
      # A local model for the cogs: Ollama on the host (host.docker.internal:11434). A profile model written
      # "ollama/<name>" uses it; with HUBPROTO_OLLAMA_FALLBACK=1 claude-* profiles use HUBPROTO_OLLAMA_MODEL when no
      # ANTHROPIC_API_KEY is set. Leave HUBPROTO_OLLAMA_URL empty to use the deterministic stand-in.
      HUBPROTO_OLLAMA_URL: ${HUBPROTO_OLLAMA_URL:-http://host.docker.internal:11434}
      HUBPROTO_OLLAMA_MODEL: ${HUBPROTO_OLLAMA_MODEL:-granite4.2:3b}
      HUBPROTO_OLLAMA_FALLBACK: ${HUBPROTO_OLLAMA_FALLBACK:-1}
      # Optional: HUBPROTO_EXTRACTOR=claude and ANTHROPIC_API_KEY for guided-mode extraction
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - cad-worker
      - collabora
    restart: unless-stopped

  # Ollama on this machine listens on 127.0.0.1 only; this relay listens on the Docker bridge address (what
  # host.docker.internal resolves to inside the containers) and forwards to it, so the hub can use the local model
  # without changing Ollama's own configuration. Remove it if Ollama is set to listen on all interfaces.
  ollama-relay:
    image: alpine/socat:latest
    container_name: hub-erp-ollama-relay
    network_mode: host
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        IP=$$(ip -4 -o addr show docker0 | awk '{print $$4}' | cut -d/ -f1);
        echo "relaying $$IP:11434 to 127.0.0.1:11434";
        exec socat TCP-LISTEN:11434,bind=$$IP,fork,reuseaddr TCP:127.0.0.1:11434
    restart: unless-stopped

  # Cogs as users, as a service: the shell leaves items assigned to a cog waiting and this worker takes them
  # through the same decide path. Default is inline (the shell lets a cog take its turn at once); to use the
  # service, set HUBPROTO_COG_USERS=service on the hub and run: docker compose --profile cog-users up -d
  cog-users:
    image: hub-erp-proto:local
    container_name: hub-erp-cog-users
    command: ["hubproto", "cog-users", "--loop", "5"]
    volumes:
      - hub-state:/hub/state
      - ./frames:/hub/frames
      - ./profiles:/hub/profiles
    environment:
      HUBPROTO_ROOT: /hub
      HUBPROTO_CAD_WORKER_URL: http://cad-worker:9000
    profiles: ["cog-users"]
    depends_on:
      - hub
    restart: unless-stopped

  # Collabora Online: the office editor documents open in. It fetches files from the hub over WOPI
  # (http://hub:8080/wopi/...) and the browser loads its pages from localhost:9980.
  collabora:
    image: collabora/code:latest
    container_name: hub-erp-collabora
    ports:
      - "127.0.0.1:9980:9980"
    environment:
      aliasgroup1: http://hub:8080
      server_name: ${HUBPROTO_COLLABORA_HOST:-localhost:9980}
      extra_params: --o:ssl.enable=false --o:ssl.termination=false --o:net.content_security_policy=frame-ancestors ${HUBPROTO_PUBLIC_URL:-http://localhost:8080};
      dictionaries: en_US
    cap_add:
      - MKNOD
    restart: unless-stopped

  # FreeCAD and KiCad behind the /invoke seam. Large image; build with:
  #   docker compose build cad-worker
  # Without the tools installed (CAD_TOOLS=none) it answers with synthetic exports.
  cad-worker:
    build:
      context: .
      dockerfile: docker/cad-worker/Dockerfile
      args:
        CAD_TOOLS: ${CAD_TOOLS:-full}
    image: hub-erp-cad-worker:local
    container_name: hub-erp-cad-worker
    environment:
      HUBPROTO_CAD_FAKE: ${HUBPROTO_CAD_FAKE:-0}
    expose:
      - "9000"
    restart: unless-stopped

  # One-off escalation tick for SLAs; run with: docker compose run --rm tick
  tick:
    image: hub-erp-proto:local
    profiles: ["tools"]
    volumes:
      - hub-state:/hub/state
      - ./frames:/hub/frames
      - ./profiles:/hub/profiles
    entrypoint: ["hubproto", "tick"]

volumes:
  hub-state:
