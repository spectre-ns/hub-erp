[project]
name = "hubproto"
version = "0.1.0"
description = "Prototype: Frames compile to a policy release; Ops run with Guards, Gates and Tracks; Cogs are team members."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml"]
claude = ["anthropic"]
test = ["pytest"]
dev = ["pytest>=8", "pytest-xdist>=3.5"]  # development only (requirements-dev.txt); never a runtime dependency

[project.scripts]
hubproto = "hubproto.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hubproto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
