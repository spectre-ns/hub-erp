# The test suite on every pull request and every push to main. It needs nothing outside the repository: tests never
# call a model (stand-in answers and fakes), the CAD tests run in fake mode, and Ollama URLs are faked.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]   # the oldest supported (requires-python) and the newest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install
        run: python -m pip install -e ".[test]" -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q -n auto
